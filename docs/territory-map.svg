<svg xmlns="http://www.w3.org/2000/svg" width="920" height="928" viewBox="-6 -30 924 936" font-family="PingFang SC, Helvetica, sans-serif">
  <!-- 世界坐标 x/z ∈ [-96,96] 以 4px/米 映射：px=(x+96)*4, py=(z+96)*4，z 越大越靠下（与游戏地图一致） -->
  <defs>
    <pattern id="hatchSea" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e8f1f8"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#bcd6ec" stroke-width="1.5"/>
    </pattern>
    <pattern id="hatchOverlap" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="rgba(211,47,47,0.10)"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#d32f2f" stroke-width="2.4"/>
    </pattern>
  </defs>

  <!-- 标题 -->
  <text x="384" y="-10" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">划地盘 · 全员现状平面图（世界坐标 192m×192m · 4px/米）</text>

  <!-- 底色 + 海面装饰 -->
  <rect x="0" y="0" width="768" height="768" fill="#f4f1ea"/>
  <rect x="0" y="0" width="40" height="476" fill="url(#hatchSea)" opacity="0.4"/>
  <rect x="0" y="600" width="140" height="168" fill="url(#hatchSea)" opacity="0.5"/>
  <rect x="560" y="640" width="208" height="128" fill="url(#hatchSea)" opacity="0.5"/>

  <!-- 网格：每 24m（=96px） -->
  <g stroke="#d8d3c8" stroke-width="1">
    <line x1="96" y1="0" x2="96" y2="768"/><line x1="192" y1="0" x2="192" y2="768"/><line x1="288" y1="0" x2="288" y2="768"/><line x1="384" y1="0" x2="384" y2="768" stroke-width="1.6"/><line x1="480" y1="0" x2="480" y2="768"/><line x1="576" y1="0" x2="576" y2="768"/><line x1="672" y1="0" x2="672" y2="768"/>
    <line x1="0" y1="96" x2="768" y2="96"/><line x1="0" y1="192" x2="768" y2="192"/><line x1="0" y1="288" x2="768" y2="288"/><line x1="0" y1="384" x2="768" y2="384" stroke-width="1.6"/><line x1="0" y1="480" x2="768" y2="480"/><line x1="0" y1="576" x2="768" y2="576"/><line x1="0" y1="672" x2="768" y2="672"/>
  </g>

  <!-- ===== 各人地块（半透明填充，登记册顺序） ===== -->
  <!-- 舒雯 x[-96,-37.2] z[-96,-16.2] -->
  <rect x="0" y="0" width="235.2" height="319.2" fill="rgba(183,28,28,0.13)" stroke="#b71c1c" stroke-width="2.5"/>
  <text x="118" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#b71c1c">舒雯</text>
  <text x="118" y="168" text-anchor="middle" font-size="9" fill="#b71c1c">石栏</text>

  <!-- 唐一琳 x[16,86] z[-37,27.4] 竹篱 -->
  <rect x="448" y="236" width="280" height="257.6" fill="rgba(239,108,0,0.12)" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="588" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#ef6c00">唐一琳</text>
  <text x="588" y="378" text-anchor="middle" font-size="9" fill="#ef6c00">竹子围栏·含Altar/Social</text>

  <!-- 丁浩宸 x[-6.5,46.5] z[-73.3,-40.3] 水塘 -->
  <rect x="358" y="90.8" width="212" height="132" fill="rgba(0,131,143,0.13)" stroke="#00838f" stroke-width="2.5"/>
  <text x="464" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#00838f">丁浩宸</text>
  <text x="464" y="169" text-anchor="middle" font-size="9" fill="#00838f">水塘·木栅栏+门</text>

  <!-- 须翊恒 x[-13.5,95.1] z[28.7,94.4]（文档新界） -->
  <rect x="330" y="498.8" width="434.4" height="262.8" fill="rgba(46,125,50,0.10)" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="600" y="640" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">须翊恒</text>
  <text x="600" y="658" text-anchor="middle" font-size="9" fill="#2e7d32">右下角·10-24向西扩到x=-13.5</text>

  <!-- 龚浩翔 x[-96,-13.5] z[23,80] -->
  <rect x="0" y="476" width="330" height="228" fill="rgba(57,73,171,0.12)" stroke="#3949ab" stroke-width="2.5"/>
  <text x="165" y="600" text-anchor="middle" font-size="15" font-weight="bold" fill="#3949ab">龚浩翔</text>
  <text x="165" y="618" text-anchor="middle" font-size="9" fill="#3949ab">西南围栏区·83片</text>

  <!-- 中西部 x[-42,10] z[-8,22]（无署名/未落地，虚线） -->
  <rect x="216" y="352" width="208" height="120" fill="rgba(117,117,117,0.08)" stroke="#757575" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="320" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#757575">中西部(无署名)</text>

  <!-- ===== 陈艾琳（你）x[-96,-12] z[-6,46] 加粗强调 ===== -->
  <rect x="0" y="360" width="336" height="208" fill="rgba(0,105,92,0.16)" stroke="#00695c" stroke-width="4"/>
  <text x="168" y="440" text-anchor="middle" font-size="17" font-weight="bold" fill="#004d40">陈艾琳（你）</text>
  <text x="168" y="460" text-anchor="middle" font-size="10" fill="#004d40">x[-96,-12] z[-6,46]</text>
  <!-- 出生点 -->
  <circle cx="180" cy="468" r="6" fill="#00e676" stroke="#004d40" stroke-width="2"/>
  <text x="190" y="486" font-size="10" fill="#004d40">出生(-51,21)</text>

  <!-- ===== 交叠告警区（红斜纹） ===== -->
  <!-- 陈艾琳 × 龚浩翔：x[-96,-13.5] z[23,46] -->
  <rect x="0" y="476" width="330" height="92" fill="url(#hatchOverlap)" stroke="#d32f2f" stroke-width="2"/>
  <text x="165" y="526" text-anchor="middle" font-size="12" font-weight="bold" fill="#b71c1c">⚠ 陈艾琳×龚浩翔 ≈1897㎡</text>
  <!-- 陈艾琳 × 中西部：x[-42,-12] z[-6,22] -->
  <rect x="216" y="360" width="120" height="112" fill="url(#hatchOverlap)" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="276" y="356" text-anchor="middle" font-size="9" fill="#b71c1c">陈×中西部(未落地)</text>
  <!-- 陈艾琳 × 须翊恒(纸面细条)：x[-13.5,-12] z[28.7,46] -->
  <rect x="330" y="498.8" width="6" height="69.2" fill="#d32f2f" opacity="0.6"/>

  <!-- 地标 pin -->
  <g font-size="10" fill="#333">
    <circle cx="220.8" cy="206.4" r="5" fill="#1976d2"/><text x="229" y="204">Circuit</text>
    <circle cx="683.2" cy="327.6" r="5" fill="#1976d2"/><text x="677" y="322" text-anchor="end">Altar</text>
    <circle cx="486.8" cy="326" r="5" fill="#1976d2"/><text x="494" y="330">Social</text>
  </g>

  <!-- 边框与坐标刻度 -->
  <rect x="0" y="0" width="768" height="768" fill="none" stroke="#333" stroke-width="2"/>
  <g font-size="10" fill="#555" text-anchor="middle">
    <text x="0" y="-6">-96</text><text x="96" y="-6">-72</text><text x="192" y="-6">-48</text><text x="288" y="-6">-24</text><text x="384" y="-6">0</text><text x="480" y="-6">24</text><text x="576" y="-6">48</text><text x="672" y="-6">72</text><text x="760" y="-6">96 (x)</text>
  </g>
  <g font-size="10" fill="#555">
    <text x="774" y="4">-96</text><text x="774" y="196">-48</text><text x="774" y="388">0</text><text x="774" y="580">48</text><text x="774" y="772">96 (z↓)</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(8,782)" font-size="11">
    <rect x="0" y="0" width="16" height="11" fill="rgba(183,28,28,0.13)" stroke="#b71c1c" stroke-width="2"/><text x="21" y="10">舒雯</text>
    <rect x="80" y="0" width="16" height="11" fill="rgba(46,125,50,0.10)" stroke="#2e7d32" stroke-width="2"/><text x="101" y="10">须翊恒</text>
    <rect x="176" y="0" width="16" height="11" fill="rgba(239,108,0,0.12)" stroke="#ef6c00" stroke-width="2"/><text x="197" y="10">唐一琳</text>
    <rect x="272" y="0" width="16" height="11" fill="rgba(0,131,143,0.13)" stroke="#00838f" stroke-width="2"/><text x="293" y="10">丁浩宸</text>
    <rect x="368" y="0" width="16" height="11" fill="rgba(57,73,171,0.12)" stroke="#3949ab" stroke-width="2"/><text x="389" y="10">龚浩翔</text>
    <rect x="464" y="0" width="16" height="11" fill="rgba(0,105,92,0.16)" stroke="#00695c" stroke-width="2.5"/><text x="485" y="10" font-weight="bold" fill="#004d40">陈艾琳(你)</text>
    <rect x="588" y="0" width="16" height="11" fill="rgba(117,117,117,0.08)" stroke="#757575" stroke-width="1.5" stroke-dasharray="4 3"/><text x="609" y="10">中西部(未落地)</text>

    <rect x="0" y="26" width="16" height="11" fill="url(#hatchOverlap)" stroke="#d32f2f" stroke-width="1.5"/><text x="21" y="36">交叠告警</text>
    <circle cx="120" cy="31" r="5" fill="#00e676" stroke="#004d40"/><text x="130" y="36">你的出生点</text>
    <circle cx="238" cy="31" r="4" fill="#1976d2"/><text x="248" y="36">地标</text>
    <text x="320" y="36" fill="#555">叶老师：正方形 XXX 坐标未标定，暂无法画入</text>
  </g>
</svg>
